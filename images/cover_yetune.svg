<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8a2387" />
      <stop offset="100%" stop-color="#e94057" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.6" />
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>
  
  <!-- Background Rect -->
  <rect width="500" height="500" rx="28" fill="url(#grad)" />
  <rect width="500" height="500" rx="28" fill="url(#glow)" />
  
  <!-- Modern Geometric Elements -->
  <circle cx="250" cy="210" r="130" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="4" stroke-dasharray="10 15" />
  <circle cx="250" cy="210" r="100" fill="rgba(0,0,0,0.3)" filter="url(#shadow)" />
  <circle cx="250" cy="210" r="40" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="3" />
  
  <!-- Icon & Tag -->
  <text x="250" y="235" font-family="'Segoe UI', Roboto, sans-serif" font-size="64" text-anchor="middle">🕊️</text>
  
  <!-- Badge Tag -->
  <rect x="175" y="45" width="150" height="32" rx="16" fill="rgba(0,0,0,0.5)" stroke="rgba(255,255,255,0.3)" />
  <text x="250" y="66" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="900" fill="#fff" text-anchor="middle" letter-spacing="2">SUFI QAWWALI</text>
  
  <!-- Song Titles -->
  <rect x="30" y="370" width="440" height="95" rx="18" fill="rgba(0,0,0,0.6)" stroke="rgba(255,255,255,0.1)" />
  <text x="250" y="415" font-family="'Segoe UI Black', Impact, sans-serif" font-size="28" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">YE TUNE KYA KIYA</text>
  <text x="250" y="445" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="600" fill="rgba(255,255,255,0.8)" text-anchor="middle" letter-spacing="2">MUMBAAI DOBAARA</text>
</svg>